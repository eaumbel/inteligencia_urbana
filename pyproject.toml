[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inteligencia-urbana"
version = "0.1.0"
description = "Ferramenta de análise de matrículas, diretrizes urbanísticas, zoneamento e viabilidade de empreendimentos imobiliários."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "shapely>=2.0",
    "pdfplumber>=0.10",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inteligencia_urbana = ["dados/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
